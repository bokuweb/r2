[package]
name = "app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
clap = { version = "4.4.11", features = ["derive"] }
# Aliased because a dependency literally named `core` shadows the `core`
# built-in crate inside macro expansions such as clap's derive.
r2_core = { path = "../core", package = "core" }
devices = { path = "../devices" }
device_interfaces = { path = "../device_interfaces" }

[[bin]]
name = "core"
path = "src/main.rs"
