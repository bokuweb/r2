name: ci
on: [push, pull_request]

jobs:
  test:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      # Run inside the checkout so the `rust-toolchain` override decides which
      # toolchain gets the targets.
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - run: cargo check
      - run: cargo build -p app
      - run: cargo build -p wasm --release --target wasm32-unknown-unknown
      - run: cargo build -p wasi --release --target wasm32-wasip1
